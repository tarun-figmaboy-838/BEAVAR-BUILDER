<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Bridge Builder: Triangles</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/gameplay.css">
  <link rel="stylesheet" href="styles/animations.css">
  <link rel="stylesheet" href="styles/responsive.css">
  <!-- One classic script (built from js/ by tools/build.py) so the game also runs when index.html is opened from disk. -->
  <script src="js/game.bundle.js" defer></script>
</head>
<body>
  <div id="viewport" class="viewport">
    <div id="stage" class="stage" aria-label="Bridge Builder game stage">

      <!-- World: everything the camera controller moves. -->
      <div id="world" class="world">
        <div id="shake" class="shake-layer">
          <div class="backdrop"><img src="assets/images/background/canal.png" alt="" draggable="false"></div>
          <div id="water" class="water-layer" aria-hidden="true"></div>
          <div id="bridge" class="bridge"></div>
          <div id="placed" class="placed-layer"></div>
          <div id="focus-dim" class="focus-dim" aria-hidden="true"></div>
          <div id="platform" class="platform"></div>
          <div id="crane" class="crane"></div>
          <div id="fx" class="fx-layer" aria-hidden="true"></div>
        </div>
      </div>

      <!-- HUD: fixed to the stage, never moved by the camera. -->
      <div id="hud" class="hud">
        <!-- The task card stays fixed and on top while the camera zooms (nothing in the scene passes over it). -->
        <div id="instruction" class="instruction-banner" role="status" aria-live="polite" hidden></div>
        <button id="mute" class="icon-button mute-button" type="button" aria-label="Mute sound" aria-pressed="false"></button>
      </div>

      <!-- Screen overlays: title banner, builder bubble, how-to card, completion. -->
      <div id="overlays" class="overlays"></div>

      <!-- Crane controls: the four direction keys on the left (LEFT / RIGHT along the jib, UP / DOWN in depth);
           one action button on the right that reads PICK and flips to DROP once a frame is on the hook. -->
      <section id="controls" class="controls" aria-label="Crane controls" hidden>
        <div class="dpad-dock">
          <div id="dpad" class="dpad" role="group" aria-label="Move the crane">
            <img class="dpad__plate" src="assets/images/kit/dpad-plate.png" alt="" draggable="false">
            <button class="dpad__key dpad__key--up" type="button" tabindex="-1" data-direction="up" aria-label="Send the hook back toward the bridge"><img src="assets/images/kit/key-up.png" alt="" draggable="false"></button>
            <button class="dpad__key dpad__key--right" type="button" tabindex="-1" data-direction="right" aria-label="Move the crane right"><img src="assets/images/kit/key-right.png" alt="" draggable="false"></button>
            <button class="dpad__key dpad__key--down" type="button" tabindex="-1" data-direction="down" aria-label="Bring the hook forward to the yard"><img src="assets/images/kit/key-down.png" alt="" draggable="false"></button>
            <button class="dpad__key dpad__key--left" type="button" tabindex="-1" data-direction="left" aria-label="Move the crane left"><img src="assets/images/kit/key-left.png" alt="" draggable="false"></button>
          </div>
        </div>
        <div class="action-dock">
          <button id="action-button" class="action-button" type="button" data-mode="pick" aria-label="Pick the triangle" disabled>
            <span class="action-button__face action-button__face--pick"><img class="action-button__art" src="assets/images/kit/btn-pick.png" alt="" draggable="false"><span class="action-button__sheen" aria-hidden="true"></span></span>
            <span class="action-button__face action-button__face--drop"><img class="action-button__art" src="assets/images/kit/btn-drop.png" alt="" draggable="false"></span>
          </button>
        </div>
      </section>

      <div id="debug" class="debug-overlay" hidden></div>
      <div id="loader" class="loader" role="status" aria-label="Loading the construction site"><img class="loader__logo" src="assets/images/kit/title-logo.png" alt="" draggable="false" fetchpriority="high"><div class="loader__bar"><span class="loader__fill"><span class="loader__hook"></span></span></div><p class="loader__text">Loading the construction site<span class="loader__dots"><i>.</i><i>.</i><i>.</i></span></p></div>
    </div>
  </div>
  <noscript><p style="color:#fff;font:20px sans-serif;text-align:center">Please enable JavaScript to play.</p></noscript>
</body>
</html>
